version: '1.0'
name: Xec
description: Published Xec drives this repository; Turbo owns the package DAG and cache.
tasks:
  bootstrap:
    description: Install the pinned workspace and published Xec driver.
    command: pnpm install --frozen-lockfile
  build:
    description: Build the candidate CLI and its workspace dependencies.
    timeout: 10m
    command: pnpm exec turbo run build --filter=@xec-sh/cli
  build:full:
    description: Build every workspace through the package DAG.
    timeout: 10m
    command: pnpm exec turbo run build
  dev:
    description: Run workspace development tasks through Turbo.
    command: pnpm exec turbo run dev
  test:
    description: Run workspace tests through Turbo.
    command: pnpm exec turbo run test
  typecheck:
    description: Check workspace types through the package graph and validate project commands.
    steps:
      - name: Workspace types
        command: pnpm exec turbo run typecheck
      - name: Project command types
        command: pnpm exec tsc -p .xec/tsconfig.json
  lint:
    description: Lint package sources, project commands and website components.
    command: pnpm exec eslint "{apps,packages}/**/*.{js,jsx,ts,tsx}" ".xec/{commands,lib}/**/*.{js,ts}" "website/src/**/*.{js,jsx,ts,tsx}"
  docs:check:
    description: Verify documentation examples against the declared APIs.
    timeout: 5m
    steps:
      - name: Documentation verifier contracts
        command: node --test scripts/test/doc-examples.test.js
      - name: Typecheck documented examples
        command: xec docs check --strict
  docs:build:
    description: Build the Lumen site and verify its generated links and anchors.
    timeout: 12m
    steps:
      - name: Compile with Lumen
        command: pnpm --dir website exec lumen build
      - name: Verify generated routes
        command: pnpm --dir website exec node scripts/check-routes.js
  docs:start:
    description: Serve the documentation with live updates.
    command: pnpm --dir website start
  docs:serve:
    description: Preview the built documentation site.
    command: pnpm --dir website serve
  check:lockfile:
    description: Verify frozen dependency resolution without installing packages.
    command: pnpm install --frozen-lockfile --lockfile-only
  check:ssh:
    description: Verify SSH files, transport boundaries and packed security; stop on any failure.
    steps:
      - name: SSH contracts
        command: pnpm --filter @xec-sh/ssh test
      - name: Native transport contracts
        command: pnpm --filter @xec-sh/ssh test:transport
      - name: Security verifier contracts
        command: node --test .xec/tests/ssh-security.test.js
      - name: Packed SSH security
        command: pnpm check:ssh-security
  check:ssh-security:
    description: Verify the packed SSH runtime against hostile peers.
    command: xec ssh security
