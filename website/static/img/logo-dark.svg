<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Xec">
  <title>Xec</title>
  <defs>
    <linearGradient id="xecMark" x1="6" y1="26" x2="26" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4EE2F5"/>
    </linearGradient>
  </defs>

  <!-- Four paths crossing one point: the X of "Xec", and the four
       environments reached through a single API. Symmetrical on both axes, so
       it holds together down to 16px — the previous mark put a 3.4-wide caret
       against 1.8-wide fan-out strokes, which read as lopsided at any size and
       collapsed into noise in a favicon. -->
  <g stroke="url(#xecMark)" fill="none" stroke-width="3.2" stroke-linecap="round">
    <path d="M7.5 7.5 L24.5 24.5"/>
    <path d="M24.5 7.5 L7.5 24.5"/>
  </g>

  <g fill="url(#xecMark)">
    <circle cx="7.5" cy="7.5" r="2.7"/>
    <circle cx="24.5" cy="7.5" r="2.7"/>
    <circle cx="7.5" cy="24.5" r="2.7"/>
    <circle cx="24.5" cy="24.5" r="2.7"/>
  </g>
</svg>
