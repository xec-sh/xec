<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Xec">
  <title>Xec</title>
  <defs>
    <linearGradient id="xecMark" x1="6" y1="26" x2="26" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4EE2F5"/>
    </linearGradient>
  </defs>

  <!-- Four routes crossing one point: the X of "Xec", and the four
       environments reached through a single API. The terminals are squares
       turned onto the diagonal, so they sit along the axis of the stroke they
       end rather than fighting it. Symmetrical on both axes and a single
       stroke weight, which is what lets it hold at 16px — the previous mark
       set a 3.4-wide caret against 1.8-wide fan-out strokes and collapsed
       into a smudge in a favicon. -->
  <g stroke="url(#xecMark)" fill="none" stroke-width="2.8">
    <path d="M7.5 7.5 L24.5 24.5"/>
    <path d="M24.5 7.5 L7.5 24.5"/>
  </g>

  <g fill="url(#xecMark)">
    <rect x="4.5" y="4.5" width="6.0" height="6.0" rx="0.9" transform="rotate(45 7.5 7.5)"/>
    <rect x="21.5" y="4.5" width="6.0" height="6.0" rx="0.9" transform="rotate(45 24.5 7.5)"/>
    <rect x="4.5" y="21.5" width="6.0" height="6.0" rx="0.9" transform="rotate(45 7.5 24.5)"/>
    <rect x="21.5" y="21.5" width="6.0" height="6.0" rx="0.9" transform="rotate(45 24.5 24.5)"/>
  </g>
</svg>
