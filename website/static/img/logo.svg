    <path d="M7.2 8.4 L13.6 16 L7.2 23.6" stroke-width="3.4"/>
    <path d="M15.6 16 L19.4 9.4" stroke-width="1.8"/>
    <path d="M15.6 16 L19.6 16" stroke-width="1.8"/>
    <path d="M15.6 16 L19.4 22.6" stroke-width="1.8"/>
  </g>

  <g fill="url(#xecMark)">
    <circle cx="22.2" cy="8" r="2.6"/>
    <circle cx="22.4" cy="16" r="2.6"/>
    <circle cx="22.2" cy="24" r="2.6"/>
  </g>
</svg>
