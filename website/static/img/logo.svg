<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Xec">
  <title>Xec</title>
  <defs>
    <linearGradient id="xecMark" x1="6" y1="26" x2="26" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D3BF5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- A shell prompt whose command fans out to three environments. The
       caret and the upper dispatch path cross to form the X of "Xec". -->
