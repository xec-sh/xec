# Unit-tier tests for every package, plus the cross-runtime smoke.
#
# Deliberately absent: integration and e2e suites. They need the Docker
# fixture containers (packages/core/docker) and a kind cluster, which is a
# separate job with its own budget — not a reason to leave the unit tier
# unguarded.
#
# Extension, not enabled — a Node matrix costs a second full run per version,
# and that spend is the owner's call:
#   strategy:
#     matrix:
#       node-version: ['22.18', '24']
# engines declares >=22, so 22.x is the floor worth proving.

name: test

on:
  push:
    branches: [main]
  pull_request:
  # A run can fail without the code being at fault — GitHub's action
  # resolution has gone Service Unavailable and killed a job before it
  # started. Re-running then should not require an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# A superseded push to a PR has no audience; a run on main always finishes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner has Docker, so the SSH fixture gate would otherwise try to
      # build and boot the fixture containers inside the unit tier — minutes
      # of image builds, and a beforeAll failure when they don't come up.
      # Fixture-backed suites belong to the future integration job.
      SKIP_SSH_DOCKER_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node: the store cache needs the binary on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.15.2'

      # Bun is a build dependency, not just a smoke target: @xec-sh/kit
      # uses the shared Xec package pipeline with Bun bundling.
      - uses: oven-sh/setup-bun@v2

      # Deno exists here so the runtime smoke actually runs. Without it the
      # Deno case skips and the suite goes green having proven nothing.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - name: Audit locked dependencies
        run: pnpm audit --audit-level low

      - name: Published Xec bootstrap before building candidate packages
        run: |
          node --test scripts/test/repository-bootstrap.test.js .xec/tests/package-build.test.js

      - name: build
        id: build
        run: pnpm build:full

      - name: Local Linux no-replace publication
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! command -v strace >/dev/null; then sudo apt-get update && sudo apt-get install -y strace; fi
          pnpm --filter @xec-sh/linux-fs test
          pnpm --dir packages/linux-fs exec node --test test/faults.test.mjs
          mkdir -p "$RUNNER_TEMP/linux-fs-archive"
          pnpm --dir packages/linux-fs pack --pack-destination "$RUNNER_TEMP/linux-fs-archive"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: linux-fs-packed
          path: ${{ runner.temp }}/linux-fs-archive/*.tgz
          if-no-files-found: error

      # Collect independent failures in one run; any failed check still fails CI.
      - name: Packaged SSH security and artifact integrity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec xec run check:ssh

      - name: core unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/core test:unit test/integration/kubernetes-lifecycle-native.test.ts test/integration/docker-lifecycle-native.test.ts

      - name: core property
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/core test:property

      - name: loader unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/loader test test/unit

      - name: kit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/kit test

      - name: ops
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/ops test

      # The fixture helpers run inside every other package's suite, so a
      # fault in them fails the wrong tests — or worse, makes one skip and
      # report green having proven nothing.
      - name: testing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/testing test

      # The CLI's docker-free tier. test/commands and test/docker-services
      # spawn containers and kind clusters — they belong to the future
      # integration job.
      - name: cli unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          pnpm --filter @xec-sh/cli test
          test/utils
          test/command-manifest.test.ts
          test/direct-argv.test.ts
          test/dynamic-command-imports.test.ts
          test/eval-exit-code.test.ts
          test/globals-parity.test.ts
          test/runtime-portability.test.ts
          test/self-resolution.test.ts
          test/startup-budget.test.ts
          test/entry-point.test.ts
          test/graceful-cancellation.test.ts
          test/docker-services/service-contracts.test.ts
          test/commands/docker-prune.test.ts

      # Every code example in the documentation, compiled against the real
      # published types plus the globals a script receives. An example that
      # names something the API does not have is a defect the reader hits
      # and the page never admits to.
      - name: doc examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm docs:check

      # The built CLI must start under Node, Bun and Deno and deliver the
      # script globals. Runs last: it proves the artifact, not the sources.
      - name: runtime smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/cli test test/runtime-smoke.test.ts

  linux-fs-arm64:
    needs: unit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: linux-fs-packed
          path: ${{ runner.temp }}/linux-fs-archive
      - name: Exercise the same archive on native arm64
        run: |
          if ! command -v strace >/dev/null; then sudo apt-get update && sudo apt-get install -y strace; fi
          mkdir "$RUNNER_TEMP/linux-fs-consumer"
          cp packages/linux-fs/test/*.mjs "$RUNNER_TEMP/linux-fs-consumer/"
          cd "$RUNNER_TEMP/linux-fs-consumer"
          npm install --offline --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/linux-fs-archive/*.tgz
          node --test rename.test.mjs faults.test.mjs

  # Windows is not a platform this project has ever tested, and it is one
  # the code claims: core picks `cmd` quoting from `platform() === 'win32'`,
  # kills process trees with taskkill, and spells paths through node:path
  # throughout. A claim nothing exercises is a claim that is true by
  # accident until somebody depends on it.
  #
  # Narrower than the Linux job on purpose. Docker fixtures, kind and the
  # Deno/Bun smoke are not the question here; whether the escaping, the
  # path handling and the CLI's own startup survive a different platform
  # is.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SKIP_SSH_DOCKER_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.15.2'

      # kit builds with bun, and ops needs kit's types to compile, so the
      # dependency chain cannot be skipped even though this job does not
      # test bun itself. Building only core/ops/cli failed here on the
      # first run: `Cannot find module '@xec-sh/kit'`.
      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - name: Published Xec bootstrap before building candidate packages
        run: node --test scripts/test/repository-bootstrap.test.js .xec/tests/package-build.test.js

      - name: Prepare a release and resume from its frozen workspace
        shell: bash
        env:
          GIT_AUTHOR_NAME: Release verification
          GIT_AUTHOR_EMAIL: release-check@example.invalid
          GIT_COMMITTER_NAME: Release verification
          GIT_COMMITTER_EMAIL: release-check@example.invalid
        run: |
          git clone --local --no-tags . "$RUNNER_TEMP/xec-release-check"
          cd "$RUNNER_TEMP/xec-release-check"
          pnpm install --frozen-lockfile
          pnpm exec xec release --list-packages
          version=$(node -e 'const current = require("./packages/core/package.json").version; console.log(require("semver").inc(current, "patch") + "-ci.0")')
          pnpm release "$version" --dry-run
          pnpm release "$version" --prepare --yes
          pnpm release "$version" --resume --no-push --skip-npm --skip-github --yes
          git diff --exit-code

      # `...` builds the package and everything it depends on.
      # Preparation and independent contract checks must report in one run.
      # A failed check still fails the job; only cancellation or an unusable
      # build prevents the later checks.
      - name: build
        id: build
        if: ${{ !cancelled() }}
        run: pnpm --filter @xec-sh/cli... build

      - name: Packaged SSH security and artifact integrity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec xec run check:ssh

      - name: Release failure and recovery contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/ops test test/release

      - name: core unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/core test:unit test/integration/kubernetes-lifecycle-native.test.ts test/integration/docker-lifecycle-native.test.ts

      - name: core property
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/core test:property

      - name: Loader module security and source ownership
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @xec-sh/loader test test/unit/module test/unit/core/code-evaluator.test.ts

      - name: cli unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          pnpm --filter @xec-sh/cli test
          test/utils
          test/command-manifest.test.ts
          test/direct-argv.test.ts
          test/startup-budget.test.ts
          test/entry-point.test.ts
          test/docker-services/service-contracts.test.ts
          test/commands/docker-prune.test.ts
