# Unit-tier tests for every package, plus the cross-runtime smoke.
#
# Deliberately absent: integration and e2e suites. They need the Docker
# fixture containers (packages/core/docker) and a kind cluster, which is a
# separate job with its own budget — not a reason to leave the unit tier
# unguarded.
#
# Extension, not enabled — a Node matrix costs a second full run per version,
# and that spend is the owner's call:
#   strategy:
#     matrix:
#       node-version: ['22.18', '24']
# engines declares >=22, so 22.x is the floor worth proving.

name: test

on:
  push:
    branches: [main]
  pull_request:
  # A run can fail without the code being at fault — GitHub's action
  # resolution has gone Service Unavailable and killed a job before it
  # started. Re-running then should not require an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# A superseded push to a PR has no audience; a run on main always finishes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner has Docker, so the SSH fixture gate would otherwise try to
      # build and boot the fixture containers inside the unit tier — minutes
      # of image builds, and a beforeAll failure when they don't come up.
      # Fixture-backed suites belong to the future integration job.
      SKIP_SSH_DOCKER_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node: the store cache needs the binary on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # Bun is a build dependency, not just a smoke target: @xec-sh/kit
      # builds with `bun scripts/build.ts`.
      - uses: oven-sh/setup-bun@v2

      # Deno exists here so the runtime smoke actually runs. Without it the
      # Deno case skips and the suite goes green having proven nothing.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:full

      - name: core unit
        run: pnpm --filter @xec-sh/core test:unit

      - name: core property
        run: pnpm --filter @xec-sh/core test:property

      - name: loader unit
        run: pnpm --filter @xec-sh/loader test test/unit

      - name: kit
        run: pnpm --filter @xec-sh/kit test

      - name: ops
        run: pnpm --filter @xec-sh/ops test

      - name: testing
        run: pnpm --filter @xec-sh/testing test

      # The CLI's docker-free tier. test/commands and test/docker-services
      # spawn containers and kind clusters — they belong to the future
      # integration job.
      - name: cli unit
        run: >
          pnpm --filter @xec-sh/cli test
          test/utils
          test/command-manifest.test.ts
          test/dynamic-command-imports.test.ts
          test/eval-exit-code.test.ts
          test/globals-parity.test.ts
          test/runtime-portability.test.ts
          test/self-resolution.test.ts
          test/startup-budget.test.ts
          test/entry-point.test.ts

      # Every code example in the documentation, compiled against the real
      # published types plus the globals a script receives. An example that
      # names something the API does not have is a defect the reader hits
      # and the page never admits to.
      - name: doc examples
        run: pnpm docs:check

      # The built CLI must start under Node, Bun and Deno and deliver the
      # script globals. Runs last: it proves the artifact, not the sources.
      - name: runtime smoke
        run: pnpm --filter @xec-sh/cli test test/runtime-smoke.test.ts

  # Windows is not a platform this project has ever tested, and it is one
  # the code claims: core picks `cmd` quoting from `platform() === 'win32'`,
  # kills process trees with taskkill, and spells paths through node:path
  # throughout. A claim nothing exercises is a claim that is true by
  # accident until somebody depends on it.
  #
  # Narrower than the Linux job on purpose. Docker fixtures, kind and the
  # Deno/Bun smoke are not the question here; whether the escaping, the
  # path handling and the CLI's own startup survive a different platform
  # is.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SKIP_SSH_DOCKER_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # kit builds with bun, and ops needs kit's types to compile, so the
      # dependency chain cannot be skipped even though this job does not
      # test bun itself. Building only core/ops/cli failed here on the
      # first run: `Cannot find module '@xec-sh/kit'`.
      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      # `...` builds the package and everything it depends on.
      - name: build
        run: pnpm --filter @xec-sh/cli... build

      - name: core unit
        run: pnpm --filter @xec-sh/core test:unit

      - name: core property
        run: pnpm --filter @xec-sh/core test:property

      - name: cli unit
        run: >
          pnpm --filter @xec-sh/cli test
          test/utils
          test/command-manifest.test.ts
          test/startup-budget.test.ts
          test/entry-point.test.ts
